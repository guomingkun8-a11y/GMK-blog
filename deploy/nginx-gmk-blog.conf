# GMK-blog 站点配置（域名：gmkyr.website）
# 80：ACME 续期验证 + 301 跳 HTTPS；443：站点主服务
# 证书：Let's Encrypt，certbot 自动续期

# --- 80：域名访问一律跳转 HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name gmkyr.website www.gmkyr.website;

    # Let's Encrypt 续期验证路径，必须保留，否则 90 天后续期失败
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 80：兜底（IP 直连等未匹配域名）---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}

# --- 443：站点主服务 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name gmkyr.website www.gmkyr.website 121.40.193.80;

    root /var/www/gmk-blog;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/gmkyr.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gmkyr.website/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
    }

    location / {
        # HTML 不缓存：防止浏览器拿旧页面引用已被删除的旧 hash CSS
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
