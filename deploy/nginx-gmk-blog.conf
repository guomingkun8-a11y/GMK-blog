# GMK-blog 静态站（阿里云 ECS 121.40.193.80 / Ubuntu）
# 由 deploy/deploy.sh 自动分发到 /etc/nginx/sites-available/gmk-blog

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/gmk-blog;
    index index.html;

    # FastAPI 后端：浏览器走同源 /api，避免 CORS 和 HTTPS 混合内容问题
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # 页面：不缓存，发版即生效；Astro 目录式输出（/about -> /about/index.html）
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # 带哈希的构建产物：永久缓存（^~ 优先于正则）
    location ^~ /_astro/ {
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # 3D 模型 / PDF / 图片：内容不变，30 天缓存
    location ~* \.(glb|gltf|hdr|pdf|webp|png|jpe?g|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 大文件传输优化（3D 模型、PDF）
    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
